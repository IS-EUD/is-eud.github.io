<nav class="navbar lg:navbar-expand site-nav">
	<div class="container">
		<a class="navbar-brand d-flex align-items-center gap-2" href="{{ '/' | relative_url }}">
			<img
				src="{% link assets/images/logo-sm.svg %}"
				height="30"
				alt="">
			IS-EUD
		</a>
		<button
			class="navbar-toggler"
			type="button"
			data-bs-toggle="drawer"
			data-bs-target="#navbarSupportedContent"
			aria-controls="navbarSupportedContent"
			aria-label="Toggle navigation">
			<span class="navbar-toggler-icon"></span>
		</button>
		<dialog class="lg:drawer drawer-end" id="navbarSupportedContent" aria-label="Main navigation">
			<div class="drawer-header">
				<span class="drawer-title d-flex align-items-center gap-2">
					<img src="{% link assets/images/logo-sm.svg %}" height="26" alt="">
					IS-EUD
				</span>
				<button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
			</div>
			<div class="drawer-body">
			<ul class="navbar-nav lg:ms-auto lg:align-items-center">
				{% for navlink in site.data.navigation %}
					<li class="nav-item">
						{% if navlink.file %}
							<a class="nav-link {% if page.path == navlink.file %}active{% endif %}" href="{% link {{ navlink.file }} %}"{% if page.path == navlink.file %} aria-current="page"{% endif %}>
								{{ navlink.title }}
							</a>
						{% else %}
							<a class="nav-link disabled">
								{{ navlink.title }}
							</a>
						{% endif %}
					</li>
				{% endfor %}
				<li class="nav-item theme-item lg:ms-2">
					<button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">
						<svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
						<svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
						<span class="theme-label label-dark">Dark mode</span>
						<span class="theme-label label-light">Light mode</span>
					</button>
				</li>
			</ul>
			</div>
		</dialog>
	</div>
</nav>
