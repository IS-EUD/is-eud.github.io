---
layout: base
---

<header class="page-header">
	<div class="container">
		<span class="eyebrow mb-2">IS-EUD</span>
		<h1 class="display-5 mb-0">{{ page.title }}</h1>
		{% if page.lead %}<p class="lead text-body-secondary mt-3 mb-0" style="max-width: 60ch;">{{ page.lead }}</p>{% endif %}
	</div>
</header>
<article class="container pt-5">
	<div class="{{ page.content_class | default: 'prose' }}">
		{{ content }}
	</div>
</article>
